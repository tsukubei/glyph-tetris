plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.glyphtetris'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.glyphtetris'
        minSdk 33          // Glyph Matrix SDK の最低要件
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Nothing公式の glyph-matrix-sdk-2.0.aar を app/libs/ に置く(READMEまたはCIが取得する)
    implementation fileTree(dir: 'libs', include: ['*.aar'])
}
