   name: Build APK

   on:
     push:
     workflow_dispatch:

   jobs:
     build:
       runs-on: ubuntu-latest
       defaults:
         run:
           working-directory: glyph-tetris
       steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-java@v4
           with:
             distribution: temurin
             java-version: '17'

         - uses: android-actions/setup-android@v3

         - name: Fetch Glyph Matrix SDK (official repo)
           run: |
             mkdir -p app/libs
             curl -fsSL -o app/libs/glyph-matrix-sdk-2.0.aar \
               https://github.com/Nothing-Developer-Programme/GlyphMatrix-Developer-Kit/raw/main/glyph-matrix-sdk-2.0.aar
             ls -l app/libs

         - uses: gradle/actions/setup-gradle@v4

         - name: Build debug APK
           run: |
             chmod +x gradlew
             ./gradlew assembleDebug --no-daemon

         - uses: actions/upload-artifact@v4
           with:
             name: glyph-tetris-debug-apk
             path: glyph-tetris/app/build/outputs/apk/debug/app-debug.apk
